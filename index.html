    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "CV Builder",
        "url": "%SITE_URL%/",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Any (web browser)",
        "inLanguage": ["en", "tr"],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "Free, private and ATS-friendly CV builder. PDF and Word export, ATS score, job posting match and cover letters."
      }
    </script>

  <body>
    <div id="root"></div>
    <noscript>
      <main style="max-width: 640px; margin: 40px auto; padding: 0 16px; font-family: system-ui, sans-serif; line-height: 1.6">
        <h1>CV Builder: a free, ATS-friendly CV maker</h1>
        <p>Build a professional CV without signing up or watermarks and download it as PDF or Word. Your CV is scored the way an applicant tracking system (ATS) reads it, with suggestions for every bullet.</p>
        <ul>
          <li>Real-text PDFs that applicant tracking systems can read</li>
          <li>Job posting match analysis and cover letters</li>
          <li>Import an existing CV (PDF, Word, LinkedIn)</li>
          <li>Your data stays in your browser</li>
        </ul>
        <p><strong>This app requires JavaScript.</strong> Please enable JavaScript in your browser.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
