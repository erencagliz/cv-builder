name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the editor
        2. ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Chrome 131 on Windows 11
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Interface language
      options: [English, Turkish]
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, console errors, or a backup file with personal data removed.
